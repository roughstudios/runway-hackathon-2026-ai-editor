[project]
name = "ai-editor"
version = "0.1.0"
description = "AI documentary editor in your voice + likeness — Runway ML API Hackathon 2026 submission"
authors = [{ name = "Jonny von Wallström", email = "jonny@vonwallstrom.com" }]
requires-python = ">=3.10"

dependencies = [
    "runwayml>=1.0.0",
    "elevenlabs>=1.0.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
studioos = [
    # Editable install of pre-existing StudioOS infrastructure
    # pip install -e ../StudioOS-v1
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_editor*"]
